{% extends "base.html" %}
{% block title %}New session — Mini League{% endblock %}
{% block body %}
<h1>New session</h1>
<p class="sub">The season is inferred from the date.</p>

{% if error %}<div class="flash error">{{ error }}</div>{% endif %}

<div class="card">
  <form method="post" action="/admin/session/new">
    <label for="date">Date</label>
    <input type="date" id="date" name="date" value="{{ today }}" required>

    <label for="notes" style="margin-top:12px">Notes (optional)</label>
    <input type="text" id="notes" name="notes" placeholder="Windy, short fields">

    <button class="btn primary" style="margin-top:14px" type="submit">Create session</button>
    <a class="btn" style="margin-top:14px" href="/admin">Cancel</a>
  </form>
</div>

{% if current_season %}
  <p class="muted small">Current season: {{ current_season.name }}</p>
{% endif %}
{% endblock %}
