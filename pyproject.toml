[project]
name = "mini-league"
version = "0.1.0"
description = "Ultimate frisbee mini-league: TrueSkill ratings, balanced team generation, leaderboard."
authors = [
    { name = "jpbranson", email = "jpbranson@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "trueskill>=0.4.5",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # upstream: trueskill 0.4.5 has an unescaped backslash in an ASCII-art docstring
    "ignore:invalid escape sequence:SyntaxWarning",
    # upstream: starlette's TestClient warns about its own httpx and anyio usage
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
