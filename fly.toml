# Fly.io deployment. See DEPLOY.md for the steps, including the two secrets
# that must be set before the organizer screens will open.
app = "memphis-mini-league"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  MINI_LEAGUE_DATABASE_URL = "sqlite:////data/mini_league.db"

# SQLite is a single file, so exactly one machine may run at a time. Two would
# race each other and lose results.
[mounts]
  source = "mini_league_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
